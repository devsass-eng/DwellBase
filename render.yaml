services:
  - type: web
    name: dwellbase-api
    env: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: node server/migrate.js && node server/index.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dwellbase-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: "*"

databases:
  - name: dwellbase-db
    databaseName: dwellbase
    user: dwellbase_user
    plan: free
    region: oregon
