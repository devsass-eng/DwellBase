services:
  - type: web
    name: dwellbase-api
    env: node
    region: oregon
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: node server/migrate.js && node server/index.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dwellbase-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: "*"

  - type: web
    name: dwellbase-app
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://dwellbase-api.onrender.com

databases:
  - name: dwellbase-db
    databaseName: dwellbase
    user: dwellbase_user
    plan: free
    region: oregon
